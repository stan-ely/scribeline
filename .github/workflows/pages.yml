# Builds the site and publishes it to GitHub Pages.
#
# ONE THING TO KNOW ABOUT THIS HOST: GitHub Pages serves no custom headers, so
# site/_headers is inert here. Cross-Origin-Opener-Policy and
# Cross-Origin-Embedder-Policy will NOT be set on the deployed page.
#
# That is not cosmetic. Without those two headers the page is not cross-origin
# isolated, `SharedArrayBuffer` is unavailable, and whisper.cpp runs
# single-threaded -- several times slower than it does against `npm start`,
# which does send them. site/main.js reads `crossOriginIsolated` once and picks
# the single-threaded build rather than failing, so the deploy works; it is just
# slow in a way that local development will never reveal. That is not an
# assumption: `SCRIBELINE_NO_ISOLATION=1 npm start` reproduces this host exactly,
# and transcription has been run end to end under it.
#
# The two real fixes are a host that reads _headers (Cloudflare Pages, Netlify)
# or a service worker that injects the headers into its own responses. Both are
# real changes with real trade-offs, and neither is a scaffold-sized decision.
# Until one is made, this comment is the record that the slowness is known and
# located.
#
# frame-ancestors is inert here for the same reason, and site/main.js's own
# refusal to run in a frame exists precisely for hosts that cannot set the
# header. The CSP itself is unaffected: it is delivered in a <meta> tag
# generated by scripts/build-site.mjs, so it survives a host that sets no
# headers at all.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-deployed site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Gated on the suite rather than deploying whatever built. The page asks
      # people to open their own recordings in it; an untested push is not
      # something to publish under that.
      - run: npm test
      - run: npm run typecheck

      # The engine is a compiled artifact, not a checked-in one -- see
      # scripts/fetch-whisper.mjs. It is cached on the inputs that determine it:
      # the whisper.cpp tag and the two files that replace upstream's. Change
      # either and the key changes and the build reruns; change anything else
      # and it does not, because an emscripten build of whisper.cpp is minutes
      # that a stylesheet edit should not pay for.
      - id: engine
        uses: actions/cache@v4
        with:
          path: vendor/whisper
          key: whisper-${{ hashFiles('scripts/fetch-whisper.mjs', 'whisper/emscripten.cpp', 'whisper/CMakeLists.txt') }}

      - if: steps.engine.outputs.cache-hit != 'true'
        run: node scripts/fetch-whisper.mjs

      # Fails the deploy rather than publishing a page whose Transcribe button
      # does nothing. `npm run build` deliberately tolerates a missing engine so
      # that a clone without a wasm toolchain still works; a deploy is the one
      # place where that tolerance would ship a broken promise.
      - name: Check the engine was built
        run: test -f vendor/whisper/whisper.js

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
