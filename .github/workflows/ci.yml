# Unit tests, both typecheck projects, and the build, on every push and pull
# request. Everything here is offline -- no model is downloaded, no browser is
# launched, no network is touched. A red tick means this repository is broken,
# never that a third party was having a bad afternoon, which is the only way a
# red tick keeps meaning anything.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is a large part of what
      # a CI run is for.
      - run: npm ci

      - run: npm test

      # BOTH projects. The browser one is checked with `types: []`, which is
      # what stops a `Buffer` or a `process` reaching code served to a page --
      # a failure that would otherwise typecheck cleanly and throw at runtime.
      # `npm run typecheck` runs both; neither half is a useful check alone.
      - run: npm run typecheck

      # The site build is a real consumer of src/, so a build failure is a
      # source failure. It also proves the CSP generator can still import
      # ENGINE_ORIGINS, which is what keeps the policy honest.
      - run: npm run build
